name: Daily Regime Refresh

on:
  # Run at 22:30 UTC (after US market close at 21:00 UTC / 4pm ET + buffer)
  # Monday–Friday only
  schedule:
    - cron: "30 22 * * 1-5"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4          # v4 runs on Node 24 already (warning is cosmetic)
        with:
          fetch-depth: 0                   # full history so git push works
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5      # v5 also runs on Node 24 (warning is cosmetic)
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the refresh script ──────────────────────────────────────────
      - name: Run daily refresh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python refresh.py

      # ── 5. Commit and push — native git, no third-party push action ───────
      # Using native git instead of ad-m/github-push-action (community action,
      # no confirmed Node 24 update). Native git has zero Node dependency.
      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/us_combined_daily.parquet \
            data/processed/us_features_daily.parquet \
            data/processed/us_features_zscored.parquet \
            data/processed/us_regime_labels.parquet \
            data/processed/us_regime_labels.csv \
            data/processed/refresh_log.json \
            refresh.log

          # Only commit + push if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit — dataset already current."
          else
            git commit -m "chore: daily regime refresh $(date -u '+%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
          fi